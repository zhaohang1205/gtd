[package]
name = "gtp"
version = "0.1.0"
edition = "2021"
description = "GTD terminal task manager (data layer + CLI), with time-datafication and a tag system"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
ratatui = "0.30"
ratatui-crossterm = "0.1"
crossterm = "0.28"
