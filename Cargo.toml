[package]
name = "gtp"
version = "0.1.0"
edition = "2021"
description = "GTD terminal task manager (data layer + CLI), with time-datafication and a tag system"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zhaohang1205/gtd"
rust-version = "1.89"
keywords = ["gtd", "todo", "tui", "task-manager", "pomodoro"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = "0.28"
tempfile = "3.27.0"
notify-rust = "4.18.0"

[profile.release]
strip = true
